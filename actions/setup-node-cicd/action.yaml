name: Setup Node.js
description: Install Node.js and configure the private npm registry

inputs:
  npm-token:
    description: Auth token for the private npm registry
    required: true
  node-version:
    description: Node.js version to use
    default: '24'

outputs:
  npmrc-path:
    description: Path to the configured .npmrc file, for use with NPM_CONFIG_USERCONFIG
    value: ${{ steps.write-npmrc.outputs.path }}

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'
        package-manager-cache: true

    - name: Setup npmrc
      id: write-npmrc
      shell: bash
      run: |
        echo "registry=https://npm.artifacts.tdkottke.com" > /tmp/cicd.npmrc
        echo "//npm.artifacts.tdkottke.com/:_authToken=${{ inputs.npm-token }}" >> /tmp/cicd.npmrc
        echo "save-exact=true" >> /tmp/cicd.npmrc
        echo "path=/tmp/cicd.npmrc" >> "$GITHUB_OUTPUT"

    - name: Install dependencies
      shell: bash
      run: npm ci
      env:
        NPM_CONFIG_USERCONFIG: /tmp/cicd.npmrc